name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sample-app ./sample_app

      - name: Run container
        run: docker run -d -p 8000:8000 --name app sample-app

      - name: Smoke test
        run: |
          sleep 5
          curl --fail http://localhost:8000/

      - name: Show container logs on failure
        if: failure()
        run: docker logs app